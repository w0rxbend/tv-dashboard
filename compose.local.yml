services:
  backend:
    image: ${LOCAL_BACKEND_IMAGE:-tv-dashboard-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.example}
    environment:
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3001}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${LOCAL_FRONTEND_IMAGE:-tv-dashboard-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dashboard:
    driver: bridge
